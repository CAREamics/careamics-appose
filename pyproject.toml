[project]
name = "careamics-appose"
dynamic = ["version"]
description = "Codes for using CAREamics with Appose more conveniently"
readme = "README.md"
authors = [
    { name = "Mehdi Seifi", email = "mehdiseifi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "appose>=0.12.0",
    "careamics>=0.3.3",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
