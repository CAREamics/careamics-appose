[project]
name = "careamics-appose"
version = "0.1.0"
description = "Codes for using CAREamics with Appose more conveniently"
readme = "README.md"
authors = [
    { name = "Mehdi Seifi", email = "mehdiseifi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "appose>=0.12.0",
    "careamics>=0.3.3",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
